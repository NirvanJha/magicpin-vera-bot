# Fly.io — always-on single machine in Mumbai with a persistent volume.
#   fly launch --no-deploy --copy-config   (pick a unique app name)
#   fly volumes create vera_data --region bom --size 1
#   fly deploy
app = "magicpin-vera-bot"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  VERA_STATE_FILE = "/data/vera_state.json"

[[mounts]]
  source = "vera_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # never sleep: 3 missed healthz polls = disqualified
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/v1/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

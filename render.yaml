# Render Blueprint. Use a paid instance: free instances sleep after ~15 min idle,
# and a cold start can fail the judge's warmup healthz check.
services:
  - type: web
    name: magicpin-vera-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    numInstances: 1
    healthCheckPath: /v1/healthz
    autoDeploy: false            # never redeploy mid-test: a restart wipes in-memory context
    # State is in-memory. For restart resilience add a disk at /data and VERA_STATE_FILE=/data/vera_state.json
    # (POST /v1/teardown wipes it at the end of the test).
